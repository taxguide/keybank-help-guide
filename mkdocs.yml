site_name: KeyBank Help Guide
site_description: Complete KeyBank Login and Online Banking Documentation
site_url: https://keybank-help-guide-keybank-help-guide.readthedocs-hosted.com/

theme:
  name: material
  language: en
  logo: images/logo.png

  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Login Guides:
      - KeyBank Login: articles/keybank-login-page.md
      - Key Navigator Login: articles/key-navigator-login.md
      - Website Login: articles/website-login.md

  - Recovery:
      - Account Recovery: articles/account-login.md

  - Troubleshooting:
      - KeyTrade Login: articles/keytrade-login.md

  - Contact: articles/navigator-login-guide.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
