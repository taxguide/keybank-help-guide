site_name: KeyBank Help Guide
site_description: Complete KeyBank Login and Online Banking Documentation

theme:
  name: material
  language: en
  custom_dir: docs/overrides

  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest

  palette:
    - scheme: default
      primary: blue
      accent: light blue

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Login: articles/keybank-login-page.md
  - Reset Password: articles/account-login.md
  - Mobile App: articles/keytrade-login.md
  - Routing Number: articles/key-navigator-login.md
  - Contact: articles/website-login.md
  - FAQ: articles/navigator-login-guide.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
